name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: go vet ./...
      - run: go test ./...
      - name: dist/ui.css is fresh
        run: go run ./cmd/build && git diff --exit-code dist/
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - name: package.json version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
